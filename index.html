```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jastip Apip 🍁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-emerald-700 text-white rounded-2xl p-6 shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-calculator"></i> Jastip Apip 🍁
                </h1>
                <p class="text-emerald-100 text-sm mt-1">South Korea (KRW) to Indonesia (IDR)</p>
            </div>
            <div class="bg-emerald-800/80 backdrop-blur rounded-xl p-3 border border-emerald-600/50 flex items-center gap-3 text-sm">
                <div>
                    <label class="block text-xs text-emerald-200">Exchange Rate (1 KRW)</label>
                    <div class="font-semibold flex items-center gap-1">
                        <span>Rp</span>
                        <input type="number" id="exchangeRateInput" value="13.59" step="0.01" class="w-20 bg-emerald-900/60 border border-emerald-500 rounded px-1.5 py-0.5 text-white font-bold text-center focus:outline-none">
                    </div>
                </div>
            </div>
        </header>

        <!-- Base Fee Card -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-slate-800">Customer Base Fee</h3>
                    <p class="text-xs text-slate-500">Flat service fee applied once per customer order</p>
                </div>
            </div>
            <div class="flex items-center gap-2 font-medium">
                <span class="text-slate-500">Rp</span>
                <input type="number" id="baseFeeInput" value="20000" step="1000" class="w-28 border border-slate-300 rounded-lg px-3 py-1.5 text-slate-800 font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
        </div>

        <!-- Items Container -->
        <div id="itemsContainer" class="space-y-4"></div>

        <!-- Action Buttons -->
        <div class="flex gap-3">
            <button onclick="addItem()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-3 px-4 rounded-xl border border-slate-300 transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-plus text-emerald-600"></i> Add Another Item
            </button>
        </div>

        <!-- Order Summary Footer -->
        <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-file-invoice-dollar text-emerald-600"></i> Order Summary
            </h2>

            <div class="space-y-2 text-sm">
                <div class="flex justify-between text-slate-600">
                    <span>Subtotal Items (<span id="summaryItemCount">0</span>)</span>
                    <span id="summaryItemsTotal" class="font-semibold">Rp 0</span>
                </div>
                <div class="flex justify-between text-slate-600">
                    <span>Customer Base Fee</span>
                    <span id="summaryBaseFee" class="font-semibold">Rp 20,000</span>
                </div>
                <div class="border-t border-slate-200 pt-3 flex justify-between items-center">
                    <span class="text-base font-bold text-slate-800">Grand Total</span>
                    <span id="summaryGrandTotal" class="text-2xl font-extrabold text-emerald-700">Rp 0</span>
                </div>
            </div>

            <button onclick="copyWhatsAppQuote()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-base cursor-pointer">
                <i class="fa-brands fa-whatsapp text-xl"></i> Copy Customer Quote for WhatsApp
            </button>
        </div>
    </div>

    <!-- Custom Modal for Notifications instead of alert() -->
    <div id="notificationModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4 text-center">
            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 id="modalTitle" class="font-bold text-lg text-slate-800">Success</h3>
            <p id="modalMessage" class="text-sm text-slate-600"></p>
            <button onclick="closeModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition cursor-pointer">OK</button>
        </div>
    </div>

    <script>
        // CONFIGURATION & DEFAULTS
        let exchangeRate = 13.59;
        let customerBaseFee = 20000;
        let itemCount = 0;

        // Volume Tiers configuration with respective multipliers
        const volumeTiers = [
            { id: 'A', multiplier: 1.0, label: "Tier A: Flat / Micro (1.0x)" },
            { id: 'B', multiplier: 1.1, label: "Tier B: Small Accessories / Makeup (1.1x)" },
            { id: 'C', multiplier: 1.125, label: "Tier C: Standard Skincare / Small Merch (1.125x)" },
            { id: 'D', multiplier: 1.175, label: "Tier D: Albums / Bulky Sets (1.175x)" },
            { id: 'E', multiplier: 1.25, label: "Tier E: Special Edition / Heavy / Fragile (1.25x)" }
        ];

        function getVolumeTierObj(tierId) {
            return volumeTiers.find(t => t.id === tierId) || volumeTiers[0];
        }

        // Sliding Scale Fee Calculation: 42.5% down to 20%
        // Drops by 0.25% per 100 KRW increment between 1,000 KRW and 10,000 KRW
        function calculateSlidingFeePercentage(krwPrice) {
            if (krwPrice <= 1000) {
                return 42.5;
            } else if (krwPrice >= 10000) {
                return 20.0;
            } else {
                // Difference from 1,000 KRW in steps of 100 KRW
                const steps = (krwPrice - 1000) / 100;
                const percentage = 42.5 - (steps * 0.25);
                return Math.max(20.0, percentage);
            }
        }

        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('notificationModal').classList.remove('hidden');
            document.getElementById('notificationModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('notificationModal').classList.remove('flex');
            document.getElementById('notificationModal').classList.add('hidden');
        }

        function addItem() {
            itemCount++;
            const id = itemCount;
            const container = document.getElementById('itemsContainer');
            
            const card = document.createElement('div');
            card.id = `item-card-${id}`;
            card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 relative transition hover:shadow-md";
            
            // Generate dropdown options for volume tiers
            let tierOptionsHtml = '';
            volumeTiers.forEach(t => {
                tierOptionsHtml += `<option value="${t.id}">${t.label}</option>`;
            });

            card.innerHTML = `
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <span class="font-bold text-slate-700 flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center">${id}</span>
                        Item #${id}
                    </span>
                    ${id > 1 || document.querySelectorAll('[id^="item-card-"]').length > 0 ? `<button onclick="removeItem(${id})" class="text-xs text-rose-500 hover:text-rose-700 font-semibold flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-trash"></i> Remove</button>` : ''}
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Item Description / Name</label>
                            <input type="text" id="desc-${id}" placeholder="e.g. Toner / Lipstick / Album" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Price in Korean Won (KRW)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-2.5 text-xs font-bold text-slate-400">₩</span>
                                <input type="number" id="krw-${id}" oninput="calculateOrder()" placeholder="0" class="w-full border border-slate-300 rounded-lg pl-8 pr-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col justify-center">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Volume Category (Tier A - E)</label>
                            <select id="tier-${id}" onchange="calculateOrder()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                ${tierOptionsHtml}
                            </select>
                        </div>
                        <div class="text-xs text-slate-500 mt-1">
                            <span id="tierInfo-${id}">Select tier to view multiplier & fee breakdown</span>
                        </div>
                    </div>
                </div>

                <div class="bg-emerald-50/60 rounded-xl p-3 border border-emerald-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="space-y-0.5">
                        <span id="badge-${id}" class="inline-block bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-bold">Fee %: -</span>
                        <p id="feeKrwText-${id}" class="text-slate-500">Jastip Fee: ₩0</p>
                    </div>
                    <div class="text-right">
                        <span class="text-slate-500 block">Item Total (IDR)</span>
                        <span id="itemTotal-${id}" class="text-base font-extrabold text-emerald-700">Rp 0</span>
                    </div>
                </div>
            `;

            container.appendChild(card);
            calculateOrder();
        }

        function removeItem(id) {
            const card = document.getElementById(`item-card-${id}`);
            if (card) card.remove();
            calculateOrder();
        }

        function calculateOrder() {
            exchangeRate = parseFloat(document.getElementById('exchangeRateInput').value) || 13.59;
            customerBaseFee = parseFloat(document.getElementById('baseFeeInput').value) || 0;

            let itemsGrandTotal = 0;
            const itemCards = document.querySelectorAll('[id^="item-card-"]');

            itemCards.forEach(card => {
                const id = card.id.replace('item-card-', '');
                const krw = parseFloat(document.getElementById(`krw-${id}`).value) || 0;
                const tierId = document.getElementById(`tier-${id}`).value;
                const tierObj = getVolumeTierObj(tierId);

                // Calculate sliding percentage based on price
                const feePercentage = calculateSlidingFeePercentage(krw);
                
                // Base fee amount in KRW = Price * (Fee % / 100)
                const baseFeeKRW = krw * (feePercentage / 100);
                
                // Final jastip fee in KRW = Base fee * Volume Tier Multiplier
                const finalFeeKRW = baseFeeKRW * tierObj.multiplier;
                
                // Total item price in KRW = Item Price + Final Jastip Fee
                const totalItemKRW = krw + finalFeeKRW;
                
                // Convert to IDR
                const itemTotalIDR = Math.round(totalItemKRW * exchangeRate);
                itemsGrandTotal += itemTotalIDR;

                // Update UI badge & info
                document.getElementById(`badge-${id}`).innerText = `Fee Rate: ${feePercentage.toFixed(2)}%`;
                document.getElementById(`tierInfo-${id}`).innerText = `Multiplier: ${tierObj.multiplier}x applied to fee`;
                document.getElementById(`feeKrwText-${id}`).innerText = `Jastip Fee: ₩${Math.round(finalFeeKRW).toLocaleString('en-US')} (${tierObj.id} tier)`;
                document.getElementById(`itemTotal-${id}`).innerText = `Rp ${itemTotalIDR.toLocaleString('id-ID')}`;
            });

            document.getElementById('summaryItemCount').innerText = itemCards.length;
            document.getElementById('summaryItemsTotal').innerText = `Rp ${itemsGrandTotal.toLocaleString('id-ID')}`;
            document.getElementById('summaryBaseFee').innerText = `Rp ${customerBaseFee.toLocaleString('id-ID')}`;
            document.getElementById('summaryGrandTotal').innerText = `Rp ${(itemsGrandTotal + customerBaseFee).toLocaleString('id-ID')}`;
        }

        function copyWhatsAppQuote() {
            const itemCards = document.querySelectorAll('[id^="item-card-"]');
            let itemsText = "";
            let grandTotal = customerBaseFee;
            let itemsGrandTotal = 0;

            itemCards.forEach((card, index) => {
                const id = card.id.replace('item-card-', '');
                const desc = document.getElementById(`desc-${id}`).value || `Item ${index + 1}`;
                const krw = parseFloat(document.getElementById(`krw-${id}`).value) || 0;
                const tierId = document.getElementById(`tier-${id}`).value;
                const tierObj = getVolumeTierObj(tierId);

                const feePercentage = calculateSlidingFeePercentage(krw);
                const baseFeeKRW = krw * (feePercentage / 100);
                const finalFeeKRW = baseFeeKRW * tierObj.multiplier;
                const totalItemKRW = krw + finalFeeKRW;
                const totalIDR = Math.round(totalItemKRW * exchangeRate);
                itemsGrandTotal += totalIDR;
                grandTotal = itemsGrandTotal + customerBaseFee;

                itemsText += `${index + 1}. *${desc}*\n   • Price: ₩${krw.toLocaleString('en-US')}\n   • Volume Tier: ${tierObj.id} (${tierObj.multiplier}x)\n   • Total Price: Rp ${totalIDR.toLocaleString('id-ID')}\n\n`;
            });

            const quote = `🛍️ *JASTIP KOREA QUOTATION*\n-----------------------------------\n${itemsText}📌 *Customer Base Fee:* Rp ${customerBaseFee.toLocaleString('id-ID')}\n-----------------------------------\n💰 *GRAND TOTAL:* Rp ${grandTotal.toLocaleString('id-ID')}\n\n_Note: Calculated with sliding-scale fee & volume multipliers._`;

            navigator.clipboard.writeText(quote).then(() => {
                showModal("Copied!", "WhatsApp quote copied to clipboard successfully!");
            });
        }

        document.getElementById('exchangeRateInput').addEventListener('input', calculateOrder);
        document.getElementById('baseFeeInput').addEventListener('input', calculateOrder);

        // Add first item by default on load
        addItem();
    </script>
</body>
</html>
```
